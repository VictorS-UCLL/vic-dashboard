name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# One run at a time per ref. Two pushes in quick succession would otherwise
# race each other into the same Deployment, and the loser could land last.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege by default; the build job widens this for itself.
permissions:
  contents: read

jobs:
  # Build runs on a GitHub-hosted runner, not the self-hosted one. Building
  # needs a Docker daemon, and on the self-hosted runner that means the runner
  # user is in the docker group — which is root-equivalent on the machine that
  # also hosts the cluster. Nothing about building requires LAN access, so it
  # does not belong there.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: VictorS-UCLL
          password: ${{ secrets.REGISTRY_TOKEN }}

      # Tagged by commit SHA, not :latest. An immutable tag means the running
      # image can be traced to an exact commit, a previous image still exists
      # to roll back to, and the Deployment spec actually changes on deploy
      # rather than being restarted in place.
      - name: Build and push image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/victors-ucll/vic420-portfolio:${{ github.sha }}

  # Deploy runs on the self-hosted runner because GitHub cannot reach the
  # cluster: it is behind NAT with no inbound path. That is the only reason
  # a self-hosted runner exists in this pipeline.
  deploy:
    needs: build
    # Guard: a workflow_dispatch on a feature branch builds and pushes an image
    # for testing, but must never deploy branch code to production.
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Deploy to K3s
        env:
          KUBECONFIG: /home/vic/.kube/config
          IMAGE: ghcr.io/victors-ucll/vic420-portfolio:${{ github.sha }}
        run: |
          set -euo pipefail
          kubectl set image deployment/portfolio portfolio="$IMAGE"
          kubectl rollout status deployment/portfolio --timeout=120s

      # If the new image never becomes Ready, revert to the previous
      # ReplicaSet instead of leaving the Deployment mid-rollout.
      - name: Roll back on failed rollout
        if: failure()
        env:
          KUBECONFIG: /home/vic/.kube/config
        run: |
          kubectl rollout undo deployment/portfolio
          kubectl rollout status deployment/portfolio --timeout=120s
